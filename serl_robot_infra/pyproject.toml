[project]
name = "serl-robot-infra"
version = "0.1.0"
description = "Robot Infrastructure for HIL-SERL"
requires-python = "==3.11.*"
dependencies = [
    "flask",
    "gymnasium",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Since the content of serl_robot_infra does not have a subfolder with the same name, we force hatchling to include the root directory contents
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
# Route everything from that root directory into the 'serl_robot_infra' namespace
"." = "serl_robot_infra"