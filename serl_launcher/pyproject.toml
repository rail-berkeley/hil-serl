[project]
name = "serl-launcher"
version = "0.1.0"
description = "Launcher library for HIL-SERL"
requires-python = ">=3.10, <3.11"
dependencies = [
    "agentlace",
    "jax[cuda12_pip]==0.4.36",
    "gym>=0.26",
    "numpy>=1.24.3",
    "flax>=0.8.0",
    "distrax>=0.1.2",
    "ml-collections>=0.1.0",
    "tqdm>=4.60.0",
    "chex>=0.1.85",
    "optax>=0.1.5",
    "absl-py>=0.12.0",
    "scipy",
    "wandb>=0.12.14",
    "tensorflow>=2.18.0",
    "tensorflow-probability>=0.23.0",
    "einops>=0.6.1",
    "imageio>=2.31.1",
    "moviepy>=1.0.3",
    "pre-commit==3.3.3",
    "gymnasium==0.29.1",
    "tf-keras",
    "pynput",
    "natsort",
    "matplotlib",
]

[tool.uv]
overrite-dependencies = [
    "tensorflow==2.18.0",
    "tf-keras==2.18.0",
    "tensorflow-probability==0.24.0"
]

[build-system]
requires = ["setuptools>=64.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
agentlace = { git = "https://github.com/youliangtan/agentlace.git" }
